<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iniciar sesión - Sol de Alegría</title>
<meta name="description" content="Acceso a las áreas de Sol de Alegría." />

<script src="assets/js/tema.js"></script>
<script>
  function loginAs(role) {
    localStorage.setItem('user_role', role);
    if (role === 'admin') {
      window.location.href = 'admin/index.html';
    } else if (role === 'staff') {
      window.location.href = 'staff/index.html';
    } else {
      window.location.href = 'usuario/index.html?role=' + role;
    }
  }
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@500;600;700;800&family=Schibsted+Grotesk:wght@400;500;600;700&family=Azeret+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/shell.css" />
<link rel="stylesheet" href="assets/css/ui.css" />
<link rel="stylesheet" href="assets/css/acceso.css" />
</head>
<body>

<main class="auth">

  <section class="auth__form">
    <a class="brand" href="usuario/index.html" aria-label="Sol de Alegría - inicio">
      <span class="brand__mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand__word">Sol de Alegría</span>
    </a>

    <div>
      <h1 class="acceso-titulo">Iniciar sesión</h1>
      <p class="soft acceso-subtitulo">
        Selecciona un rol para acceder.
      </p>
    </div>

    <form class="grid formulario-acceso" onsubmit="event.preventDefault(); loginAs('usuario');">
      <div class="field">
        <label for="l-email">Correo electrónico</label>
        <input class="input" id="l-email" name="email" type="email" autocomplete="email" placeholder="usuario@empresa.com" value="demo@gmail.com" />
      </div>

      <div class="field">
        <label for="l-pass">Contraseña</label>
        <input class="input" id="l-pass" name="password" type="password" autocomplete="current-password" placeholder="••••••••••" value="123456" />
      </div>

      <p class="label">Ingresar como:</p>

      <!-- Acceso por rol -->
      <div class="roles">
        <button class="btn btn--ghost" type="button" onclick="loginAs('admin')">
          Administrador
        </button>
        <button class="btn btn--ghost" type="button" onclick="loginAs('staff')">
          Staff
        </button>
        <button class="btn btn--primary" type="button" onclick="loginAs('usuario')">
          Usuario
        </button>
      </div>
    </form>

    <a class="btn btn--ghost" href="registro.html">Crear cuenta</a>
    <p class="muted acceso-subtitulo">Acceso de demostración. Selecciona un rol para recorrer el sitio.</p>
  </section>

  <aside class="auth__aside">
    <img class="auth__bg" src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1400&q=70&auto=format&fit=crop"
         alt="" width="1400" height="933" fetchpriority="high" />

    <p class="auth__quote">Sol de Alegría</p>
    <p class="soft">Organización de eventos.</p>
    <p class="soft">Acceso para Administración, Staff y Usuario.</p>
  </aside>

</main>

<div class="toasts" aria-live="polite"></div>

<script src="assets/js/app.js" defer></script>
</body>
</html>
