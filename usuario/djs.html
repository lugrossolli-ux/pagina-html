<script>
    let tema_musical = {
        titulo: "cancion 1",
        artista: "lisa",
        duracion_minutos: 3,
        duracion_segundos: 10,
        path: "musica/cancion 1.mp3",
        playing: false,
        play: function () {
            console.log("-- función play --");
            if (!this.playing) {
                console.log("Tocando " + this.titulo);
                if (!this.audio) {
                    this.audio = new Audio(this.path);
                }
                this.audio.play();
                this.playing = true;
            }
        },
        pause: function () {
            console.log("-- función pause --");
            if (this.playing) {
                this.playing = false;
                this.audio.pause();
            }
        },
        toggle: function () {
            if (this.playing) {
                this.pause();
            } else {
                this.play();
            }
        },
    };

    let lista2 = Object.create(tema_musical);
